name: m5_forecast
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      # The original conda environment was lost when the AutoDL container was
      # recycled, so exact pins could not be captured. The unpinned list below
      # reproduces the installation set used for the original runs.
      - numpy
      - pandas
      - scipy
      - scikit-learn
      - matplotlib
      - optuna
      - wandb
      - threadpoolctl
      - tqdm
      # PyTorch: install the CUDA build via the official selector
      # (https://pytorch.org/get-started/locally/) instead of the plain wheel,
      # e.g.: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cuXXX
